<section class="wrap">
  <h1>CFKG · Búsqueda</h1>

  <form class="toolbar" (submit)="onSubmit($event)">
    <input
      type="search"
      placeholder="Buscar por label (p. ej. diesel)"
      [value]="text()"
      (input)="text.set($any($event.target).value)"

    />
    <button type="submit">Buscar</button>
  </form>

  <div *ngIf="loading()" class="status">Cargando…</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <table *ngIf="!loading() && items().length" class="list">
    <thead>
      <tr>
        <th>Factor</th>
        <th>Source</th>
        <th>Target</th>
        <th>Scope</th>
        <th>IRI</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let it of items()" (click)="openIri(it)">
        <td>{{ it.label }}</td>
        <td>{{ it.source }}</td>
        <td>{{ it.target }}</td>
        <td>{{ it.scope }}</td>
        <td class="iri">{{ it.id }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading() && !items().length" class="status">Escribe y pulsa “Buscar”.</p>
</section>
