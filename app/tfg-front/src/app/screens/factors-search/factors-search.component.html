<div class="home-container">

  <!-- HERO CARD -->
  <mat-card class="hero-card mat-elevation-z8">
    <mat-card-header>
      <div mat-card-avatar class="hero-avatar">
        <mat-icon>travel_explore</mat-icon>
      </div>

      <mat-card-title>CFKG · Emission Factor Explorer</mat-card-title>
      <mat-card-subtitle>
        Search emission factors by activity and gas.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="hero-search" (submit)="onSubmit($event)">

        <!-- Search text -->
        <mat-form-field appearance="outline" class="hero-search-field">
          <mat-label>Search factors (diesel, electricity…)</mat-label>
          <input
            matInput
            type="search"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </mat-form-field>

        <!-- Gas selector -->
        <mat-form-field appearance="outline" class="hero-gas-field">
          <mat-label>Gas</mat-label>
          <mat-select [value]="gas()" (selectionChange)="gas.set($event.value)">
            <mat-option *ngFor="let g of gases" [value]="g.value">
              {{ g.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="primary" class="hero-search-button">
          Search
        </button>

      </form>
    </mat-card-content>
  </mat-card>

  <!-- SECTORS CARD -->
  <mat-card class="sectors-card mat-elevation-z4">
    <mat-card-header>
      <mat-card-title>Featured sectors</mat-card-title>
      <mat-card-subtitle>Explore factors by activity</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="sector-grid">
        <mat-card
          class="sector-card mat-elevation-z2"
          *ngFor="let c of categories"
          (click)="searchCategory(c.tag)"
        >
          <mat-icon class="sector-icon">{{ c.icon }}</mat-icon>
          <div class="sector-text">
            <div class="sector-title">{{ c.label }}</div>
            <div class="sector-tag">{{ c.tag }}</div>
          </div>
        </mat-card>
      </div>
    </mat-card-content>
  </mat-card>

</div>
