<div class="home-container">

  <!-- TARJETA HERO -->
  <mat-card class="hero-card mat-elevation-z8">
    <mat-card-header>
      <div mat-card-avatar class="hero-avatar">
        <mat-icon>travel_explore</mat-icon>
      </div>

      <mat-card-title>CFKG · Explorador de factores</mat-card-title>
      <mat-card-subtitle>
        Busca factores de emisión o explora por sectores destacados.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="hero-search" (submit)="onSubmit($event)">
        <mat-form-field appearance="outline" class="hero-search-field">
          <mat-label>Buscar factores (diesel, propane, electricity…)</mat-label>
          <input
            matInput
            type="search"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </mat-form-field>

        <button mat-raised-button color="primary" class="hero-search-button">
          Buscar
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- TARJETA DE SECTORES -->
  <mat-card class="sectors-card mat-elevation-z4">
    <mat-card-header>
      <mat-card-title>Sectores destacados</mat-card-title>
      <mat-card-subtitle>Explora factores por áreas temáticas</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="sector-grid">
        <mat-card
          class="sector-card mat-elevation-z2"
          *ngFor="let c of categories"
          (click)="searchCategory(c.tag)"
        >
          <mat-icon class="sector-icon">{{ c.icon }}</mat-icon>
          <div class="sector-text">
            <div class="sector-title">{{ c.label }}</div>
            <div class="sector-tag">{{ c.tag }}</div>
          </div>
        </mat-card>
      </div>
    </mat-card-content>
  </mat-card>

</div>
